<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유성감속기 설계실</title>
<style>
/* VOICE: a planning office's engineering worksheet — calm, exact, verdict first.
   IDEA: the 11-step design procedure as a ruled job sheet; each step is a page, the verdict sits in the margin.
   PICTURE: the live planetary set in 3D, beside the spec tables; verdict figures large.
   COLOUR and TYPE: stone ground, black ink, one brick accent for failures and the key figure; Schibsted Grotesk.
   LAYOUT: step rail left, worksheet centre, verdict margin right; stacks on narrow screens. */
:root{color-scheme:dark;
 --bg:#141414;--panel:#1c1c1d;--ink:#e4e4e4;--text:#d6d6d6;--mute:#8a8a8a;--rule:#2a2a2a;--brick:#c8371e;--ok:#2e8b57;--okt:#5fbf86;--soft:#232324;--accent2:#7d9cb8;--warn:#c9962a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Inter",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--bg)}
header h1{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:600}
header .name{flex:1 1 220px}
header .name input{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:6px 2px;font-size:15px}
.btn{border:1px solid #3a3a3a;background:var(--panel);padding:6px 12px;border-radius:4px;cursor:pointer;min-height:32px;font-size:12px;transition:background .2s ease-out,border-color .2s ease-out}
.btn:hover{background:#2a2a2b;border-color:#4a4a4a}.btn.primary{background:var(--ink);color:#111;border-color:var(--ink)}.btn.on{border-color:var(--brick);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:0;min-height:calc(100vh - 70px)}
nav.rail{border-right:1px solid var(--rule);padding:14px 10px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
nav.rail .grp{font-size:12px;color:var(--mute);margin:16px 8px 4px;letter-spacing:.02em}
nav.rail button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px;cursor:pointer;min-height:32px;font-size:14px;color:var(--text);transition:background .2s ease-out}nav.rail button:hover{background:var(--soft)}
nav.rail button[aria-current=true]{background:#2a2a2b;color:#fff;box-shadow:inset 2px 0 0 var(--ink)}
nav.rail .dot{width:8px;height:8px;border-radius:50%;background:#3a3a3a;flex:none}
nav.rail .dot.ok{background:var(--ok)}nav.rail .dot.bad{background:var(--brick)}nav.rail .dot.warn{background:var(--warn)}
main{padding:22px max(2vw,16px) 60px;max-width:1100px}
main h2{font-size:28px;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em;font-weight:600;color:#f0f0f0}
main .lead{color:var(--mute);margin:0 0 20px;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;margin:0 0 16px}
.card h3{font-size:14px;margin:0 0 8px;font-weight:600;color:#ececec}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
label.f input,label.f select{font-size:14px;color:var(--ink);background:#151516;border:1px solid #333;border-radius:4px;padding:6px 8px;min-height:32px;font-variant-numeric:tabular-nums}
label.c{display:flex;gap:8px;align-items:center;font-size:14px;min-height:40px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
th,td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:12px}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
tr.bad td{color:var(--brick)}tr.gov td{background:var(--soft);font-weight:700}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--rule);color:var(--mute)}
.tag.규격{border-color:var(--accent2);color:var(--accent2)}.tag.모델{border-color:var(--ok);color:var(--okt)}.tag.가정{border-color:var(--brick);color:var(--brick)}
.big{font-size:clamp(34px,4.6vw,52px);font-weight:700;line-height:1;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:500;color:var(--mute)}
.bad{color:var(--brick)}.good{color:var(--okt)}
aside.verdict{border-left:1px solid var(--rule);padding:18px 16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
aside .kpi{margin:0 0 16px}
aside .kpi .label{font-size:13px;color:var(--mute)}
aside ul{list-style:none;margin:0;padding:0}
aside li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:12px}
aside li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.warns{margin:0;padding-left:18px;color:var(--mute);font-size:13px}
.range{position:relative;height:44px;margin:10px 0 4px}
.range .bar{position:absolute;top:16px;height:12px;background:var(--accent2);opacity:.35;border-radius:6px}
.range .mid{position:absolute;top:8px;width:3px;height:28px;background:var(--accent2)}
.range .tgt{position:absolute;top:2px;width:2px;height:40px;background:var(--brick)}
.range .iso{position:absolute;top:8px;width:3px;height:28px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:4px;margin-right:5px;vertical-align:middle}
#viewer{position:relative;height:440px;background:#e8eaed;border:1px solid var(--rule);border-radius:4px;overflow:hidden;touch-action:none;user-select:none}
#viewer canvas{display:block;width:100%;height:100%}
#viewer .hud{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mute)}
#viewer .ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.hbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.hbar .lab{width:210px;flex:none}
.hbar .track{flex:1;height:14px;background:var(--soft);position:relative}
.hbar .track i{position:absolute;top:0;bottom:0}
.hbar .num{width:110px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.hist{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--rule)}
.hist i{flex:1;background:var(--accent2);opacity:.6}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent2);width:0}
dialog{border:1px solid #3a3a3a;border-radius:4px;background:var(--panel);color:var(--ink);max-width:min(720px,92vw);width:100%}
dialog textarea{width:100%;height:280px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--soft);border:1px solid var(--rule);padding:8px}
.note{font-size:12px;color:var(--mute)}
main.wide{max-width:none}
#viewer.full{height:calc(100vh - 150px);min-height:560px}
.ov-head .lead{margin-bottom:12px}
.v3-ui{position:absolute;inset:0;pointer-events:none}
.v3-ui>*{pointer-events:auto}
.v3-lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.v3-lead polyline{fill:none;stroke:#3a3d42;stroke-width:1;opacity:.85}.v3-lead circle{fill:#c8371e;stroke:#fff;stroke-width:1}
.v3-labels{position:absolute;inset:0;pointer-events:none}
.v3-lab{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:224px;padding:6px 10px 6px 6px;background:#1c1c1d;border:1px solid #3a3a3a;border-radius:4px;color:var(--text);font:12px/1.3 inherit;cursor:pointer;text-align:left;transition:border-color .2s ease-out}
.v3-lab:hover{border-color:#6a6a6a}.v3-lab b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--brick);color:#fff;font-size:12px;flex:none}
.v3-lab.warn b{background:var(--warn);color:#111}.v3-lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3-tip{position:absolute;display:none;pointer-events:none;padding:4px 8px;background:#0e0e0f;border:1px solid #3a3a3a;border-radius:4px;font-size:12px;color:#eee;white-space:nowrap}
.v3-menu{position:absolute;width:240px;padding:8px;background:#1c1c1d;border:1px solid #3a3a3a;border-radius:4px;display:flex;flex-direction:column;gap:4px;font-size:12px;z-index:5}
.v3-menu .h{font-weight:600;padding:2px 4px 6px;border-bottom:1px solid var(--rule);margin-bottom:2px;color:#f0f0f0}
.v3-menu label{display:flex;flex-direction:column;gap:2px;color:var(--mute);padding:2px 4px}
.v3-menu input,.v3-menu select{background:#151516;border:1px solid #333;border-radius:4px;color:var(--ink);padding:4px 6px}
.v3-menu input[type=range]{padding:0}.v3-menu input[type=color]{height:28px;padding:2px}
.v3-menu button{background:none;border:0;border-radius:4px;color:var(--text);text-align:left;padding:6px 6px;cursor:pointer}.v3-menu button:hover{background:#2a2a2b}
.v3-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;background:rgba(20,20,21,.92);border:1px solid #333;border-radius:4px;z-index:3;flex-wrap:wrap;max-width:calc(100% - 32px)}
.v3-bar .rng{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}.v3-bar .rng input{width:80px}
.v3-bar .sep{width:1px;height:20px;background:#333}
.v3-bom{position:absolute;left:16px;top:16px;width:min(470px,calc(100% - 300px));max-height:46%;display:flex;flex-direction:column;background:rgba(22,22,23,.95);border:1px solid #333;border-radius:4px;z-index:2;transition:opacity .2s ease-out}
.v3-bom.closed{display:none}.bom-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--rule)}
.bom-s{overflow:auto}.v3-bom td,.v3-bom th{padding:4px 8px}.v3-bom tr[data-id]{cursor:pointer}.v3-bom tr[data-id]:hover td{background:#242425}.v3-bom tr.sel td{background:#2c1d18;color:#fff}
.v3-card,.v3-pop{position:absolute;width:300px;padding:12px;background:rgba(22,22,23,.97);border:1px solid #3a3a3a;border-radius:4px;z-index:4;font-size:12px}
.v3-card{right:16px;bottom:76px}.v3-pop{right:16px;top:16px;width:340px;max-height:calc(100% - 110px);overflow:auto}
.v3-card td,.v3-pop td{padding:4px 0;border-bottom:1px solid var(--rule);white-space:normal}.v3-card td:last-child,.v3-pop td:last-child{text-align:right}
.v3-card .btn{margin-top:12px;width:100%}.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.pc-h .x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;line-height:1}
.v3-pop h4{font-size:12px;color:var(--mute);font-weight:500;margin:12px 0 4px}.fx{margin:0;padding-left:18px}.fx li{margin:4px 0}
.ov-sum{margin-top:16px}
.dims td{padding:3px 0}.dims input{width:96px;background:#151516;border:1px solid #333;border-radius:4px;color:var(--ink);padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.dims input::placeholder{color:#6a6a6a}.dims input:disabled{opacity:.5}.v3-card h4{font-size:12px;color:var(--mute);font-weight:500;margin:12px 0 4px}
.v3-card{max-height:calc(100% - 92px);overflow:auto}.dimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 16px}.dimgrid .card .dims{width:100%}.iss{margin:0;padding-left:20px}.iss li{margin:4px 0}.iss li.bad::marker{color:var(--brick)}.iss li.warn::marker{color:var(--warn)}
.iss button{background:none;border:0;color:var(--text);cursor:pointer;padding:2px 0;text-align:left}.iss button:hover{color:#fff;text-decoration:underline}
@media(max-width:900px){.v3-bom{width:calc(100% - 32px);max-height:38%}.v3-pop{right:16px;width:calc(100% - 32px)}.v3-labels .v3-lab{max-width:150px}}
@media(max-width:1180px){.layout{grid-template-columns:200px minmax(0,1fr)}aside.verdict{grid-column:1/-1;position:static;border-left:0;border-top:1px solid var(--rule);max-height:none}}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav.rail{position:static;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);max-height:none;padding:6px}nav.rail .grp{display:none}nav.rail button{width:auto;white-space:nowrap;flex:none}
 aside.verdict{order:-1}.hbar .lab{width:120px}table{font-size:13px}main h2{font-size:26px}#viewer{height:320px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.comp{width:100%}.comp td,.comp th{text-align:center}.comp .l{text-align:left}.comp .sw{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.dw-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.dw-h h3{margin:0}.dw-h select{min-width:220px}
.dw-body{position:relative}.dw-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:8px}
.dw-v{margin:0;background:#f7f7f4;border:1px solid #d9d9d4;border-radius:4px;padding:6px}.dw-v figcaption{font-size:12px;color:#55575c;padding:2px 4px}
.dw-svg{width:100%;height:auto;display:block;font:10.5px "Pretendard",system-ui,sans-serif}
.dw-svg .ol{fill:none;stroke:#1f2328;stroke-width:1.1}.dw-svg .th{fill:none;stroke:#1f2328;stroke-width:.6}.dw-svg .cl,.dw-svg .axis{fill:none;stroke:#8a3b2e;stroke-width:.6;stroke-dasharray:9 2 2 2}
.dw-svg .cut{fill:url(#hat);stroke:#1f2328;stroke-width:1.1}.dw-svg .tooth{fill:#e2e4e8;stroke:#1f2328;stroke-width:.6}.dw-svg .void{fill:#f7f7f4;stroke:#1f2328;stroke-width:.8}
.dw-svg .roll{fill:#c9ccd2;stroke:#1f2328;stroke-width:.8}.dw-svg .hl{stroke:#3a3d42;stroke-width:.7}.dw-svg .cap{fill:#6b6e74}
.dw-svg .dm line,.dw-svg .dm polyline{stroke:#55575c;stroke-width:.7;fill:none}.dw-svg .dm .ext{stroke-width:.4}.dw-svg .dm text{fill:#55575c}
.dw-svg .dm .hit{stroke:transparent!important;stroke-width:9!important;pointer-events:stroke}.dw-svg .dm text{pointer-events:all}.dw-svg .dm.ed{cursor:pointer}.dw-svg .dm.ed line,.dw-svg .dm.ed polyline{stroke:#1d5fbf}.dw-svg .dm.ed text{fill:#1d5fbf;font-weight:600}
.dw-svg .dm.ed:hover text,.dw-svg .dm.ed:focus text{text-decoration:underline}.dw-svg .dm.ed:focus{outline:none}.dw-svg .dm.lk text{fill:#9a9ca1}.dw-svg .dm.lk line{stroke:#b5b7bb}
.dw-in{position:absolute;z-index:5;width:180px;padding:8px;background:#1c1c1d;border:1px solid #4a6fa5;border-radius:4px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.dw-in label{display:flex;flex-direction:column;gap:4px}.dw-in input{background:#111;border:1px solid #444;color:var(--ink);padding:4px 6px;border-radius:3px;text-align:right}
.dw-n{margin:8px 0 0}.dw-k{color:#8a8a8a}.dw-k.ed{color:#6f9fe0;font-weight:600}


/* ---- design process (PR8) */
nav.rail .grp.pg{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;margin-top:14px}nav.rail .grp.pg small{margin-left:auto;color:var(--mute);font-weight:400}
nav.rail button.sub{padding-left:22px;font-size:13px}
.pbars{display:flex;gap:2px;margin:6px 0 18px;border-radius:6px;overflow:hidden;font-size:12px}.pbar{padding:6px 8px;white-space:nowrap;overflow:hidden;color:#111}
.k-calc{background:#7fb69a}.k-in{background:#9db8d9}.k-man{background:#e0c27a}.k-none{background:#5a5a5c;color:#ddd}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.pcard .ph{display:flex;justify-content:space-between;align-items:baseline}.pcard h3{margin:0 0 8px}
.plist{list-style:none;margin:0;padding:0}.plist li{display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"id t k" "id v ok";column-gap:8px;padding:6px 4px;border-top:1px solid var(--rule);cursor:pointer;font-size:13px}
.plist li:hover{background:rgba(255,255,255,.04)}.plist .pid{grid-area:id;color:var(--mute);font-variant-numeric:tabular-nums}.plist .pt{grid-area:t}.plist .kchip{grid-area:k}.plist .pval{grid-area:v;color:var(--mute);font-size:12px}.plist li>b,.plist li>.x{grid-area:ok;justify-self:end}
.kchip{font-size:11px;padding:1px 7px;border-radius:999px;color:#111;justify-self:end;align-self:center}
.pgate{margin-top:8px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.05);font-size:12.5px}.pgate.ok{color:#7fd4a3}.pgate.bad{color:#f08a7a}
.pstrip{margin:0 0 14px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;font-size:13px}.pstrip summary{cursor:pointer;color:var(--mute)}.pstrip summary b{color:var(--ink);font-weight:500}
.pstrip ul{list-style:none;margin:8px 0 0;padding:0}.pstrip li{display:flex;gap:8px;align-items:center;padding:3px 0}.pstrip .pid{color:var(--mute);width:40px}.pstrip .pval{color:var(--mute);margin-left:auto;font-size:12px}

.pcx .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.pcx h3{margin:0 0 10px}.pcx .pid{color:var(--mute);font-weight:400;margin-right:4px}
.pres{margin:8px 0 0;font-size:13.5px}.ptbl{margin-top:10px;font-size:13px;border-collapse:collapse;width:100%}.ptbl th,.ptbl td{padding:5px 8px;border-top:1px solid var(--rule);text-align:left}.ptbl.ds th{width:40%;color:var(--mute);font-weight:400}
.sug{margin:8px 0 0;padding-left:18px;font-size:13px}.sug li{margin:4px 0}.asm{margin:8px 0 0;padding-left:20px;font-size:13px}.asm li{margin:3px 0}
.lpath{margin-top:8px;font-size:13px}.lp{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--rule)}.lp i{color:var(--mute);font-style:normal;margin:0 6px}
pre.code{max-height:240px;overflow:auto;font-size:12px;background:rgba(0,0,0,.25);padding:10px;border-radius:6px}

/* ---- stage pages (PR10) */
nav.rail button.stg{display:flex;align-items:center;gap:6px;font-weight:600}nav.rail button.stg .sn{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.08);font-size:11.5px;color:var(--mute)}
nav.rail button.stg small{margin-left:auto;font-weight:400;color:var(--mute)}nav.rail button.stg[aria-current="true"] .sn{background:#e4612a;color:#fff}
nav.rail .its{margin:2px 0 8px 10px;border-left:1px solid var(--rule)}nav.rail button.it{font-size:12.5px;padding:4px 8px 4px 12px;display:flex;align-items:center;gap:6px;color:var(--mute)}
nav.rail button.it .iid{min-width:30px;font-variant-numeric:tabular-nums}nav.rail button.it.on,nav.rail button.it:hover{color:var(--ink)}nav.rail .dot.in{background:#6f9fe0}
.shead{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}.shead .snum{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:#e4612a;color:#fff;font-size:24px;font-weight:700;flex:none}.shead h2{margin:0}
.snav ol{list-style:none;margin:0;padding:0}.snav li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:48px 1fr auto 20px;grid-template-areas:"id t k ok" "id v v ok";column-gap:10px;padding:7px 6px;border-top:1px solid var(--rule);cursor:pointer;font-size:13.5px}
.snav li:first-child button{border-top:0}.snav li button:hover,.snav li button:focus-visible{background:rgba(255,255,255,.05)}.snav .pid{grid-area:id;color:var(--mute)}.snav .pt{grid-area:t}.snav .kchip{grid-area:k}.snav .pval{grid-area:v;color:var(--mute);font-size:12px}.snav li button>b,.snav li button>.x{grid-area:ok;justify-self:end;align-self:center}
section.vw{margin-top:22px;padding-top:6px;border-top:1px dashed var(--rule)}.cardsh{margin:30px 0 10px}
.pager{display:flex;justify-content:space-between;margin:28px 0 8px}

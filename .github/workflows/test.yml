# 계산 회귀 테스트: main에 올라오는 모든 커밋과 PR에서 실행
# - compat: 기준 설계의 단별 응력·안전율·허용 토크가 compat_baseline.txt와 같은지 (의도한 변경이면 기준 파일도 함께 갱신)
# - kiss: KISSsoft 보고서 2건(스퍼·헬리컬) 대조
# - carrier / recommend: 캐리어 형상, 추천 제원
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: compat (기준값 비교)
        run: node compat_test.js > /tmp/compat.txt && diff -u compat_baseline.txt /tmp/compat.txt
      - name: KISSsoft 대조
        run: node kiss_test.js
      - name: 캐리어 형상
        run: node carrier_geometry_test.js
      - name: 추천 제원
        run: node recommend_test.js
      - name: 출력 베어링 카탈로그
        run: node bearing_catalog_test.js
      - name: 계산 수정 회귀 (피크·정역·정지 시간·구 JSON)
        run: node engine_fix_test.js
      - name: 정격토크 기준별 분해 (RH065 9:1)
        run: node rating_basis_test.js
      - name: 설계 판정 · 지정 잇수 · 해석 상태
        run: node design_review_test.js
      - name: 공용 링 · 듀티 전체 핀 · 베어링 출처 · 외력 검증 · 듀티 단위
        run: node shared_ring_duty_test.js
      - name: 추천 제원 짧은 외형 · 허용 토크 탐색 단조성
        run: node recommend_compact_test.js
      - name: 산정 기준 폭 · 저하중 경고 · C2–출력 플랜지 결합
        run: node basis_band_test.js
      - name: 출력 베어링 결합 자동 계산
        run: node ob_fit_test.js
      - name: 설계의뢰서 읽기 · 검증 · 요구 정격 산출
        run: node request_test.js
      - name: 계산식 신뢰성 (무작위 기어 제원 120세트 · 독립 구현 대조 · 물리 법칙)
        run: node verify_test.js 120 7 && node verify_test.js 120 2026
      - name: 자동 설계 (외형 고정 · 제작 규칙 · 입력 불변 · 판정 기준별)
        run: node autodesign_test.js
      - name: 베어링 기준 자동 설계
        run: node bearing_first_test.js
      - name: 유성 베어링 · 핀 독립 검증
        run: node bearing_pin_verify_test.js
      - name: 문법 검사
        run: for f in *.js; do node --check "$f" || exit 1; done

      - name: 3D 종합판정 브라우저 회귀
        env:
          NODE_PATH: ${{ runner.temp }}/overview-ui/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/overview-ui" --no-save --ignore-scripts playwright@1.56.1 three@0.128.0
          node tests/overview-browser.cjs
          node tests/request-flow-browser.cjs
